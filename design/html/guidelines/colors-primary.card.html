<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}body{padding:18px;background:var(--surface-raised);font-family:var(--font-mono);display:flex;gap:14px}
 .sw{flex:1;border-radius:12px;height:112px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-xs)}
 .n{font-size:12px;font-weight:700;letter-spacing:.04em}.h{font-size:11px;opacity:.7}
</style></head><body>
 <div class="sw" style="background:var(--lal-amarelo);color:var(--lal-bordo)"><span class="n">Amarelo</span><span class="h">#FFE57D</span></div>
 <div class="sw" style="background:var(--lal-bege);color:var(--lal-bordo)"><span class="n">Bege</span><span class="h">#FCF9E9</span></div>
 <div class="sw" style="background:var(--lal-vermelho);color:var(--lal-bege)"><span class="n">Vermelho</span><span class="h">#BD4747</span></div>
 <div class="sw" style="background:var(--lal-bordo);color:var(--lal-bege)"><span class="n">Bordô</span><span class="h">#6D2E46</span></div>
</body></html>

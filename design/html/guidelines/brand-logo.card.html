<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:0;display:flex;font-family:var(--font-mono)}
 .p{flex:1;height:180px;display:flex;align-items:center;justify-content:center}
 .mark{width:200px;height:44px;background:currentColor;-webkit-mask:url(../assets/logo-ladoalado.svg) no-repeat center/contain;mask:url(../assets/logo-ladoalado.svg) no-repeat center/contain}
</style></head><body>
 <div class="p" style="background:var(--lal-bege);color:var(--lal-preto)"><span class="mark"></span></div>
 <div class="p" style="background:var(--lal-amarelo);color:var(--lal-bordo)"><span class="mark"></span></div>
 <div class="p" style="background:var(--lal-bordo);color:var(--lal-bege)"><span class="mark"></span></div>
</body></html>

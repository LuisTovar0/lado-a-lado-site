<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & shadows" subtitle="Corner radii and warm soft shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:24px;background:var(--surface-page);font-family:var(--font-mono);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
 .c{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:var(--text-muted)}
 .b{width:74px;height:74px;background:var(--surface-card)}
</style></head><body>
 <div class="c"><div class="b" style="border-radius:var(--radius-sm)"></div>sm 6</div>
 <div class="c"><div class="b" style="border-radius:var(--radius-md)"></div>md 12</div>
 <div class="c"><div class="b" style="border-radius:var(--radius-card)"></div>card 16</div>
 <div class="c"><div class="b" style="border-radius:var(--radius-pill)"></div>pill</div>
 <div class="c"><div class="b" style="border-radius:12px;box-shadow:var(--shadow-sm)"></div>shadow-sm</div>
 <div class="c"><div class="b" style="border-radius:12px;box-shadow:var(--shadow-md)"></div>shadow-md</div>
 <div class="c"><div class="b" style="border-radius:12px;box-shadow:var(--shadow-ink);border:2px solid var(--lal-preto)"></div>ink</div>
</body></html>

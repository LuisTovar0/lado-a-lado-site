<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 html,body{margin:0}body{padding:18px;background:var(--surface-raised);font-family:var(--font-mono);display:flex;gap:14px}
 .sw{flex:1;border-radius:12px;height:112px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-xs)}
 .n{font-size:12px;font-weight:700}.h{font-size:11px;opacity:.7}
</style></head><body>
 <div class="sw" style="background:var(--lal-castanho);color:#fff"><span class="n">Castanho</span><span class="h">#97680D</span></div>
 <div class="sw" style="background:var(--lal-salmao);color:var(--lal-bordo)"><span class="n">Salmão</span><span class="h">#F3B686</span></div>
 <div class="sw" style="background:var(--lal-amarelo-deep);color:var(--lal-bordo)"><span class="n">Amarelo deep</span><span class="h">#F1C848</span></div>
 <div class="sw" style="background:var(--lal-amarelo-soft);color:var(--lal-bordo)"><span class="n">Amarelo soft</span><span class="h">#FFF2BF</span></div>
 <div class="sw" style="background:var(--lal-preto);color:var(--lal-bege)"><span class="n">Preto</span><span class="h">#000000</span></div>
</body></html>
